name: Validacion
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: minetrack
          POSTGRES_PASSWORD: minetrack
          POSTGRES_DB: minetrack_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U minetrack"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://minetrack:minetrack@localhost:5432/minetrack_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
